<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basic Probability Practice — Mr. McLean Math</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#202124;--muted:#666b73;--border:#d9dde3;--accent:#1976d2;--accent-soft:#e8f1fb;--good:#247a3b;--bad:#b3261e;--focus:#f5b400}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
body.high-contrast{--bg:#000;--panel:#090909;--text:#fff;--muted:#ddd;--border:#777;--accent:#00d7ff;--accent-soft:#111;--good:#68ff8b;--bad:#ff7474;--focus:#ffea00}
.app{max-width:920px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(28px,5vw,36px)}
.mode-buttons,.toolbar,.difficulty,.ws-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{justify-content:space-between;margin-bottom:14px}
button,select,input{font:inherit}
button,select{border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:9px 13px}
button{cursor:pointer;font-weight:650}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button[aria-pressed="true"],button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
.practice{display:grid;gap:15px}
.question{font-size:clamp(20px,3.6vw,28px);padding:18px;background:var(--accent-soft);border-radius:13px;line-height:1.45}
.note{text-align:center;color:var(--muted);font-size:14px}
.answer-row{display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}
input[type="text"]{width:min(340px,100%);font-size:21px;text-align:center;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text)}
.feedback{min-height:28px;text-align:center;font-size:18px;font-weight:700}
.feedback.correct{color:var(--good)}.feedback.incorrect{color:var(--bad)}.feedback.warn{color:var(--muted)}
.answer-key{text-align:center;color:var(--muted);font-weight:650}
.steps{max-width:700px;width:100%;margin:0 auto;background:var(--accent-soft);border:1px solid var(--border);border-radius:11px;padding:11px 13px;white-space:pre-line}
.stats{display:flex;justify-content:center;gap:20px;color:var(--muted);font-size:15px}
.worksheet{display:none}
.ws-controls{margin-bottom:14px}
.ws-list{display:grid;gap:12px}
.ws-item{border:1px solid var(--border);border-radius:11px;padding:11px 12px;break-inside:avoid}
.ws-q{font-size:17px;line-height:1.45}
.ws-answer,.ws-steps{display:none;margin-top:7px}
.ws-answer{color:var(--good);font-weight:700}
.ws-steps{background:var(--accent-soft);border-radius:9px;padding:9px;white-space:pre-line}
.ws-reveal{margin-top:7px;padding:6px 10px;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
@media(max-width:620px){.app{padding:13px}.panel{padding:14px}.answer-row{align-items:stretch}input[type="text"],.answer-row button{width:100%}}
@media print{
header,.toolbar,footer,.ws-controls,.ws-reveal{display:none!important}
body{background:#fff;color:#000}.app{max-width:none;padding:0}.panel{border:0;padding:0;background:#fff}
.worksheet{display:block!important}.ws-answer,.ws-steps{display:none!important}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Basic Probability Practice</h1>
<div class="mode-buttons" role="group" aria-label="Mode">
<button id="practiceBtn" aria-pressed="true">Practice</button>
<button id="worksheetBtn" aria-pressed="false">Worksheet</button>
</div>
</header>

<div class="toolbar">
<div class="difficulty" id="difficulty" role="group" aria-label="Difficulty">
<button data-diff="foundation" aria-pressed="true">Foundation</button>
<button data-diff="core" aria-pressed="false">Core</button>
<button data-diff="challenge" aria-pressed="false">Challenge</button>
</div>
<button id="contrastBtn" aria-pressed="false">High contrast</button>
</div>

<section id="practice" class="panel practice">
<div id="question" class="question" aria-live="polite"></div>
<div id="answerNote" class="note"></div>

<div class="answer-row">
<input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-label="Your answer">
<button id="check" class="primary">Check</button>
<button id="next" hidden>Next</button>
</div>

<div id="feedback" class="feedback" aria-live="polite"></div>
<div id="answerKey" class="answer-key"></div>
<button id="showSteps" hidden style="justify-self:center">Show steps</button>
<div id="steps" class="steps" hidden></div>

<div class="stats">
<span>Correct: <strong id="correctCount">0</strong></span>
<span>Incorrect: <strong id="incorrectCount">0</strong></span>
</div>
</section>

<section id="worksheet" class="panel worksheet">
<div class="ws-controls">
<label for="wsCount">Questions:</label>
<select id="wsCount"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option></select>
<button id="generateWs">Generate</button>
<button id="revealAll">Reveal all</button>
<button id="hideAll">Hide all</button>
<button id="printWs">Print</button>
</div>
<div id="wsInstruction" class="note" style="text-align:left;margin-bottom:14px"></div>
<div id="wsList" class="ws-list"></div>
</section>

<footer>Created by Mr. McLean Math</footer>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

const state={
mode:"practice", difficulty:"easy", currentQuestion:null, evaluated:false,
correct:0, incorrect:0, recentFingerprints:[], rngSeed:Date.now()%2147483647
};

const words = {
colors: ["red","blue","green","yellow","purple","orange","black","white","pink","brown"],
items: ["marbles","beads","counters","tokens","cubes","candies","stickers","cards","balls","buttons","erasers","pencils","toy cars","blocks","socks","bookmarks"],
containers: ["bag","jar","box","drawer","basket","bowl","cup","case","pouch","container"],
fruits: ["apples","bananas","pears","oranges","grapes","plums","peaches","kiwis"],
students: ["Emma","Leo","Sara","Noah","Mila","Lucas","Ella","Oskar","Ava","Liam","Nora","Axel","Elsa","Hugo","Maya","Oliver","Alva","Elias"],
classes: [18,20,22,24,25,28,30],
weather: [
{event:"snow", chance:60},
{event:"rain", chance:70},
{event:"fog", chance:25},
{event:"wind", chance:40},
{event:"sunshine", chance:80}
],
spinnerLabels: ["red","blue","green","yellow","orange","purple","silver","gold"],
schoolItems: ["notebooks","rulers","markers","pens","highlighters","folders"],
cardSets: [10,12,15,20,24,30,40,50,60],
subjectGroups: ["boys","girls","students wearing glasses","left-handed students","students with lunch boxes"],
gameContexts: ["board game","raffle","quiz game","card game","class game"]
};


function singularize(word){
  const special = {
    candies:"candy", peaches:"peach", kiwis:"kiwi", grapes:"grape",
    oranges:"orange", bananas:"banana", apples:"apple", pears:"pear", plums:"plum"
  };
  if(special[word]) return special[word];
  if(word.endsWith("s")) return word.slice(0,-1);
  return word;
}



function rng(){
state.rngSeed = (state.rngSeed * 48271) % 2147483647;
return state.rngSeed / 2147483647;
}

function randInt(min,max){
return Math.floor(rng() * (max - min + 1)) + min;
}

function pick(arr){
return arr[randInt(0, arr.length - 1)];
}

function shuffle(arr){
const a = arr.slice();
for(let i=a.length-1;i>0;i--){
const j = randInt(0,i);
[a[i],a[j]] = [a[j],a[i]];
}
return a;
}

function gcd(a,b){
a = Math.abs(a);
b = Math.abs(b);
while(b){
const t = b;
b = a % b;
a = t;
}
return a || 1;
}

function simplifyFraction(n,d){
const g = gcd(n,d);
return {n:n/g, d:d/g};
}

function fractionToDecimal(n,d){
return n / d;
}

function formatPct(x){
const v = x * 100;
if (Math.abs(v - Math.round(v)) < 1e-10) return String(Math.round(v)) + "%";
return stripTrailingZeros(v.toFixed(6)) + "%";
}

function stripTrailingZeros(str){
return str.replace(/(\.\d*?[1-9])0+$/,"$1").replace(/\.0+$/,"");
}

function percentStringToValue(str){
return parseFloat(str.replace("%","").replace(",", ".")) / 100;
}

function normalizeSpaces(s){
return s.replace(/\s+/g,"").trim();
}

function parseUserAnswer(raw){
if (!raw || !raw.trim()) return {ok:false, reason:"empty"};

let s = raw.trim().toLowerCase();
s = s.replace(/−/g, "-").replace(/\s+/g, "");
s = s.replace(",", ".");

if (s.endsWith("%")){
const num = s.slice(0,-1);
if (!/^[-+]?\d*\.?\d+$/.test(num)) return {ok:false, reason:"bad percent"};
return {ok:true, value:parseFloat(num)/100, type:"percent"};
}

if (s.includes("/")){
const parts = s.split("/");
if (parts.length !== 2) return {ok:false, reason:"bad fraction"};
if (!/^[-+]?\d+$/.test(parts[0]) || !/^[-+]?\d+$/.test(parts[1])) return {ok:false, reason:"bad fraction"};
const a = parseInt(parts[0],10);
const b = parseInt(parts[1],10);
if (b === 0) return {ok:false, reason:"zero denominator"};
return {ok:true, value:a/b, type:"fraction"};
}

if (!/^[-+]?\d*\.?\d+$/.test(s)) return {ok:false, reason:"bad decimal"};
return {ok:true, value:parseFloat(s), type:"decimal"};
}

function answerMatches(userRaw, q){
const parsed = parseUserAnswer(userRaw);
if (!parsed.ok) return {correct:false, parsed};
const diff = Math.abs(parsed.value - q.answerValue);
return {correct: diff < 1e-9, parsed};
}

function niceFraction(n,d){
const s = simplifyFraction(n,d);
return s.n + "/" + s.d;
}

function makeFingerprint(text){
return text.toLowerCase().replace(/\s+/g, " ").trim();
}

function pushRecentFingerprint(fp){
state.recentFingerprints.push(fp);
if(state.recentFingerprints.length > 8) state.recentFingerprints.shift();
}

function isRecentFingerprint(fp){
return state.recentFingerprints.includes(fp);
}

function chooseDifficulty(){
  return state.difficulty;
}

function makeQuestion(){
let q = null;
let tries = 0;
do{
const diff = chooseDifficulty();
if(diff === "easy") q = generateEasy();
if(diff === "medium") q = generateMedium();
if(diff === "hard") q = generateHard();
tries++;
if(tries > 50) break;
} while(isRecentFingerprint(makeFingerprint(q.text)));
pushRecentFingerprint(makeFingerprint(q.text));
q.difficulty = q.difficulty || chooseDifficulty();
return q;
}

function coinQuestion(){
const side = pick(["heads","tails"]);
return {
text: "A fair coin is flipped once. What is the probability it lands on " + side + "?",
answerValue: 1/2,
preferredAnswer: "1/2",
steps: "A fair coin has 2 equally likely outcomes.\nFavorable outcomes: 1\nTotal outcomes: 2\nProbability = 1/2",
meta: {type:"simple-coin"}
};
}

function dieQuestion(){
const face = randInt(1,6);
return {
text: "A fair die is rolled. What is the probability of rolling a " + face + "?",
answerValue: 1/6,
preferredAnswer: "1/6",
steps: "A fair die has 6 equally likely outcomes.\nFavorable outcomes: 1\nTotal outcomes: 6\nProbability = 1/6",
meta: {type:"simple-die"}
};
}

function spinnerQuestionEasy(){
const sections = pick([4,5,6,8]);
const labels = shuffle(words.spinnerLabels).slice(0, sections);
const wanted = pick(labels);
return {
text: "A spinner is divided into " + sections + " equal sections: " + labels.join(", ") + ". What is the probability it lands on " + wanted + "?",
answerValue: 1/sections,
preferredAnswer: "1/" + sections,
steps: "The spinner has " + sections + " equal sections.\nThe color " + wanted + " appears once.\nFavorable outcomes: 1\nTotal outcomes: " + sections + "\nProbability = 1/" + sections,
meta: {type:"spinner-easy"}
};
}

function numberedCardsEvenQuestion(){
const max = pick([10,12,20]);
const favorable = Math.floor(max/2);
return {
text: "There are " + max + " cards numbered 1 to " + max + ". What is the probability of drawing a card with an even number?",
answerValue: favorable / max,
preferredAnswer: niceFraction(favorable, max),
steps: "Count the even numbers from 1 to " + max + ".\nThere are " + favorable + " even numbers.\nTotal cards: " + max + "\nProbability = " + favorable + "/" + max + " = " + niceFraction(favorable, max),
meta: {type:"even-cards"}
};
}

function countObjectsQuestionEasy(){
const container = pick(words.containers);
const item = pick(words.items);
let a = randInt(2,6);
let b = randInt(2,7);
while(a === b && rng() < 0.5) b = randInt(2,7);
const c1 = pick(words.colors);
let c2 = pick(words.colors.filter(x => x !== c1));
const askColor = rng() < 0.5 ? c1 : c2;
const favorable = askColor === c1 ? a : b;
const total = a + b;
return {
text: "A " + container + " contains " + a + " " + c1 + " " + item + " and " + b + " " + c2 + " " + item + ". What is the probability of selecting a " + askColor + " " + singularize(item) + "?",
answerValue: favorable / total,
preferredAnswer: niceFraction(favorable,total),
steps: "Favorable outcomes: " + favorable + "\nTotal outcomes: " + total + "\nProbability = " + favorable + "/" + total + " = " + niceFraction(favorable,total),
meta: {type:"count-objects-easy"}
};
}

function generateEasy(){
const generators = [
coinQuestion,
dieQuestion,
spinnerQuestionEasy,
numberedCardsEvenQuestion,
countObjectsQuestionEasy
];
const q = pick(generators)();
q.difficulty = "easy";
return q;
}

function complementObjectsQuestion(){
const container = pick(words.containers);
const item = pick(words.items);
const groups = shuffle(words.colors).slice(0,3);
const a = randInt(2,6);
const b = randInt(2,6);
const c = randInt(1,5);
const counts = [a,b,c];
const notIndex = randInt(0,2);
const favorable = a + b + c - counts[notIndex];
const total = a + b + c;
return {
text: "A " + container + " has " + a + " " + groups[0] + " " + item + ", " + b + " " + groups[1] + " " + item + ", and " + c + " " + groups[2] + " " + item + ". What is the probability of not selecting a " + groups[notIndex] + " " + singularize(item) + "?",
answerValue: favorable / total,
preferredAnswer: niceFraction(favorable,total),
steps: "First find the total number of " + item + ".\nTotal = " + total + "\n" +
"The number you do NOT want is " + counts[notIndex] + ".\n" +
"So favorable outcomes = " + total + " - " + counts[notIndex] + " = " + favorable + "\n" +
"Probability = " + favorable + "/" + total + " = " + niceFraction(favorable,total),
meta: {type:"complement-objects"}
};
}

function weatherComplementQuestion(){
const w = pick(words.weather);
return {
text: "The weather forecast says there is a " + w.chance + "% chance of " + w.event + " on Saturday. What is the probability that it will not " + w.event + "?",
answerValue: (100 - w.chance) / 100,
preferredAnswer: (100 - w.chance) + "%",
steps: "The total probability is 100%.\nChance of " + w.event + " = " + w.chance + "%\nChance it does not " + w.event + " = 100% - " + w.chance + "% = " + (100 - w.chance) + "%",
meta: {type:"weather-complement"}
};
}

function classSelectionQuestion(){
const total = pick(words.classes);
let boys = randInt(8, total - 6);
const girls = total - boys;
const askGirls = rng() < 0.5;
const favorable = askGirls ? girls : boys;
const label = askGirls ? "girl" : "boy";
return {
text: "A teacher chooses a random student from a class of " + total + ". If " + boys + " students are boys, what is the probability the teacher chooses a " + label + "?",
answerValue: favorable / total,
preferredAnswer: niceFraction(favorable, total),
steps: "Total students = " + total + "\nBoys = " + boys + "\nGirls = " + girls + "\n" +
"Favorable outcomes = " + favorable + "\nProbability = " + favorable + "/" + total + " = " + niceFraction(favorable,total),
meta: {type:"class-selection"}
};
}

function whiteSockQuestion(){
const black = randInt(4,8);
const white = randInt(1,4);
const total = black + white;
return {
text: "A drawer contains " + black + " black socks and " + white + " white socks. What is the probability of drawing a white sock?",
answerValue: white / total,
preferredAnswer: niceFraction(white,total),
steps: "Favorable outcomes = white socks = " + white + "\nTotal socks = " + total + "\nProbability = " + white + "/" + total + " = " + niceFraction(white,total),
meta: {type:"sock-white"}
};
}

function fruitComplementQuestion(){
const fruitNames = shuffle(words.fruits).slice(0,3);
const a = randInt(2,6);
const b = randInt(2,5);
const c = randInt(1,4);
const total = a+b+c;
const avoid = fruitNames[1];
const favorable = a+c;
return {
text: "A basket has " + a + " " + fruitNames[0] + ", " + b + " " + fruitNames[1] + ", and " + c + " " + fruitNames[2] + ". What is the probability of not selecting a " + singularize(avoid) + "?",
answerValue: favorable / total,
preferredAnswer: niceFraction(favorable,total),
steps: "Total fruit = " + total + "\nThe fruit to avoid is " + avoid + " = " + b + "\nFavorable outcomes = " + total + " - " + b + " = " + favorable + "\nProbability = " + favorable + "/" + total + " = " + niceFraction(favorable,total),
meta: {type:"fruit-complement"}
};
}

function generateMedium(){
const generators = [
complementObjectsQuestion,
weatherComplementQuestion,
classSelectionQuestion,
whiteSockQuestion,
fruitComplementQuestion
];
const q = pick(generators)();
q.difficulty = "medium";
return q;
}

function multipleOfQuestion(){
const max = pick([20,30,40,50,60]);
const k = pick([2,3,4,5,10]);
const favorable = Math.floor(max / k);
return {
text: "A " + pick(words.gameContexts) + " uses cards numbered 1 to " + max + ". What is the probability of drawing a number that is a multiple of " + k + "?",
answerValue: favorable / max,
preferredAnswer: niceFraction(favorable, max),
steps: "Count the multiples of " + k + " from 1 to " + max + ".\nThere are " + favorable + " such numbers.\nTotal cards = " + max + "\nProbability = " + favorable + "/" + max + " = " + niceFraction(favorable,max),
meta: {type:"multiple-of"}
};
}

function raffleQuestion(){
const total = pick([40,50,60,80,100]);
const bought = pick([2,3,4,5,10].filter(v => v < total/2));
return {
text: "A raffle has " + total + " tickets. If you bought " + bought + " of them, what is the probability that your ticket is drawn?",
answerValue: bought / total,
preferredAnswer: niceFraction(bought,total),
steps: "Favorable outcomes = your tickets = " + bought + "\nTotal outcomes = " + total + "\nProbability = " + bought + "/" + total + " = " + niceFraction(bought,total),
meta: {type:"raffle"}
};
}

function notSelectingOneColorHard(){
const colors = shuffle(words.colors).slice(0,3);
const item = pick(words.items);
const a = randInt(2,5);
const b = randInt(3,6);
const c = randInt(4,8);
const counts = [a,b,c];
const avoidIndex = randInt(0,2);
const total = a+b+c;
const favorable = total - counts[avoidIndex];
return {
text: "A " + pick(words.containers) + " contains " + a + " " + colors[0] + " " + item + ", " + b + " " + colors[1] + " " + item + ", and " + c + " " + colors[2] + " " + item + ". What is the probability of not selecting a " + colors[avoidIndex] + " " + singularize(item) + "?",
answerValue: favorable / total,
preferredAnswer: niceFraction(favorable,total),
steps: "Total items = " + total + "\nAvoid color count = " + counts[avoidIndex] + "\nFavorable outcomes = " + total + " - " + counts[avoidIndex] + " = " + favorable + "\nProbability = " + favorable + "/" + total + " = " + niceFraction(favorable,total),
meta: {type:"not-select-hard"}
};
}

function mcChoicesReverseQuestion(){
const choices = pick([4,5,8,10]);
const pct = 100 / choices;
return {
text: "A student says the chance of guessing correctly on a multiple-choice question is " + pct + "%. How many answer choices are there?",
answerValue: choices,
preferredAnswer: String(choices),
steps: "If each answer choice is equally likely, then probability of guessing correctly = 1 / number of choices.\n" +
"So 1 / number of choices = " + pct + "%\n" +
pct + "% = " + (pct/100) + "\n" +
"That means 1 / number of choices = " + (pct/100) + "\n" +
"So the number of choices = " + choices,
meta: {type:"mc-choices-reverse", allowGreaterThanOne:true}
};
}

function missingBlueMarblesQuestion(){
const green = pick([4,5,6,8,10]);
const blue = pick([12,15,18,20,24,30]);
const total = green + blue;
const value = green / total;
const pct = Math.round(value * 100);
if (Math.abs(pct/100 - value) > 1e-12) return missingBlueMarblesQuestion();
return {
text: "A bowl contains only green and blue marbles. The probability of randomly selecting one of the " + green + " green marbles is " + pct + "%. How many blue marbles are in the bowl?",
answerValue: blue,
preferredAnswer: String(blue),
steps: "Probability of green = green / total\n" +
green + " / total = " + pct + "% = " + (pct/100) + "\n" +
"So total = " + green + " / " + (pct/100) + " = " + total + "\n" +
"Blue marbles = total - green = " + total + " - " + green + " = " + blue,
meta: {type:"missing-blue", allowGreaterThanOne:true}
};
}

function generateHard(){
const generators = [
multipleOfQuestion,
raffleQuestion,
notSelectingOneColorHard,
mcChoicesReverseQuestion,
missingBlueMarblesQuestion
];
const q = pick(generators)();
q.difficulty = "hard";
return q;
}



function isReverseQuestion(q){return !!(q.meta&&q.meta.allowGreaterThanOne)}
function answerInstruction(q){
return isReverseQuestion(q)?"Enter the requested number.":"You may answer as a fraction, decimal, or percent.";
}

function renderQuestion(){
state.currentQuestion=makeQuestion();state.evaluated=false;
$("#question").textContent=state.currentQuestion.text;
$("#answerNote").textContent=answerInstruction(state.currentQuestion);
$("#answer").placeholder=isReverseQuestion(state.currentQuestion)?"Enter number":"Example: 3/8, 0.375, or 37.5%";
$("#answer").value="";$("#answer").disabled=false;$("#check").disabled=false;$("#next").hidden=true;
$("#feedback").textContent="";$("#feedback").className="feedback";$("#answerKey").textContent="";
$("#showSteps").hidden=true;$("#steps").hidden=true;$("#steps").textContent="";$("#answer").focus();
}

function checkAnswer(){
if(state.evaluated)return;
const raw=$("#answer").value.trim();
if(!raw){$("#feedback").textContent="Enter an answer first.";$("#feedback").className="feedback warn";return}
const result=answerMatches(raw,state.currentQuestion);
if(!result.parsed.ok){
$("#feedback").textContent=isReverseQuestion(state.currentQuestion)?"Enter a valid number.":"Use a fraction, decimal, or percent.";
$("#feedback").className="feedback warn";return
}
const q=state.currentQuestion;
if(!isReverseQuestion(q)&&(result.parsed.value<0||result.parsed.value>1)){
$("#feedback").textContent="Probability answers must be between 0 and 1.";$("#feedback").className="feedback warn";return
}

state.evaluated=true;$("#answer").disabled=true;$("#check").disabled=true;$("#next").hidden=false;
if(result.correct){
state.correct++;$("#feedback").textContent="Correct!";$("#feedback").className="feedback correct";
}else{
state.incorrect++;$("#feedback").textContent="Incorrect.";$("#feedback").className="feedback incorrect";
$("#answerKey").textContent="Correct answer: "+q.preferredAnswer;$("#showSteps").hidden=false;
}
$("#correctCount").textContent=state.correct;$("#incorrectCount").textContent=state.incorrect;
}

$("#check").addEventListener("click",checkAnswer);
$("#next").addEventListener("click",renderQuestion);
$("#showSteps").addEventListener("click",()=>{$("#steps").textContent=state.currentQuestion.steps;$("#steps").hidden=false;$("#showSteps").hidden=true});
$("#answer").addEventListener("keydown",e=>{
if(e.key==="Enter"){e.preventDefault();state.evaluated?renderQuestion():checkAnswer()}
else if(e.key==="Escape"&&!state.evaluated)$("#answer").value="";
});

$("#difficulty").addEventListener("click",e=>{
const b=e.target.closest("button[data-diff]");if(!b)return;
const map={foundation:"easy",core:"medium",challenge:"hard"};
state.difficulty=map[b.dataset.diff];
$$("#difficulty button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
if(state.mode==="practice")renderQuestion();
});

$("#contrastBtn").addEventListener("click",()=>{
const on=document.body.classList.toggle("high-contrast");$("#contrastBtn").setAttribute("aria-pressed",String(on));
});

function setMode(mode){
state.mode=mode;const p=mode==="practice";
$("#practice").style.display=p?"grid":"none";$("#worksheet").style.display=p?"none":"block";
$("#practiceBtn").setAttribute("aria-pressed",String(p));$("#worksheetBtn").setAttribute("aria-pressed",String(!p));
if(p)renderQuestion();else{updateWorksheetInstruction();if(!$("#wsList").children.length)renderWorksheet()}
}
$("#practiceBtn").addEventListener("click",()=>setMode("practice"));
$("#worksheetBtn").addEventListener("click",()=>setMode("worksheet"));

function updateWorksheetInstruction(){
$("#wsInstruction").textContent=state.difficulty==="hard"
?"Answer each question. Probability answers may be fractions, decimals, or percents; some Challenge questions ask for a number."
:"Answer each probability question as a fraction, decimal, or percent.";
}

function renderWorksheet(){
updateWorksheetInstruction();const list=$("#wsList");list.innerHTML="";
const count=Number($("#wsCount").value)||10;const local=new Set();
for(let i=1;i<=count;i++){
let q,fp,tries=0;
do{q=makeQuestion();fp=makeFingerprint(q.text);tries++}while(local.has(fp)&&tries<80);
local.add(fp);
const item=document.createElement("div");item.className="ws-item";
item.innerHTML=`<div class="ws-q"><strong>${i}.</strong> ${q.text}</div>
<div style="margin-top:7px">Answer: ______________________________</div>
<button class="ws-reveal" aria-expanded="false">Reveal</button>
<div class="ws-answer">Answer: ${q.preferredAnswer}</div>
<div class="ws-steps">${q.steps}</div>`;
const b=item.querySelector(".ws-reveal"),a=item.querySelector(".ws-answer"),s=item.querySelector(".ws-steps");
b.addEventListener("click",()=>{const showing=a.style.display==="block";a.style.display=showing?"none":"block";s.style.display=showing?"none":"block";b.textContent=showing?"Reveal":"Hide";b.setAttribute("aria-expanded",String(!showing))});
list.appendChild(item);
}
}

$("#generateWs").addEventListener("click",renderWorksheet);
$("#revealAll").addEventListener("click",()=>{$$("#wsList .ws-answer,#wsList .ws-steps").forEach(x=>x.style.display="block");$$("#wsList .ws-reveal").forEach(b=>{b.textContent="Hide";b.setAttribute("aria-expanded","true")})});
$("#hideAll").addEventListener("click",()=>{$$("#wsList .ws-answer,#wsList .ws-steps").forEach(x=>x.style.display="none");$$("#wsList .ws-reveal").forEach(b=>{b.textContent="Reveal";b.setAttribute("aria-expanded","false")})});
$("#printWs").addEventListener("click",()=>window.print());

function runDevTests(){
const fails=[];const assert=(n,c)=>{if(!c)fails.push(n)};
assert("fraction equivalence",answerMatches("2/4",{answerValue:.5}).correct);
assert("percent equivalence",answerMatches("50%",{answerValue:.5}).correct);
assert("decimal comma",answerMatches("0,5",{answerValue:.5}).correct);
assert("zero denominator rejected",!parseUserAnswer("1/0").ok);
assert("candy singular",singularize("candies")==="candy");
assert("peach singular",singularize("peaches")==="peach");
for(let i=0;i<15000;i++)for(const d of ["easy","medium","hard"]){
state.difficulty=d;const q=makeQuestion();
assert(d+" text",typeof q.text==="string"&&q.text.length>10);
assert(d+" steps",typeof q.steps==="string"&&q.steps.length>10);
assert(d+" answer finite",Number.isFinite(q.answerValue));
if(!(q.meta&&q.meta.allowGreaterThanOne))assert(d+" range",q.answerValue>=0&&q.answerValue<=1);
if(q.answerValue>1)assert(d+" reverse tagged",q.meta&&q.meta.allowGreaterThanOne);
assert(d+" no malformed singular",!/\bcandie\b|\bpeache\b/.test(q.text));
}
console.log(fails.length?"DEV TESTS: FAIL":"DEV TESTS: PASS",fails);
}

renderQuestion();
if(new URLSearchParams(location.search).get("dev")==="1")runDevTests();
</script>
</body>
</html>
